version: 2
updates:
  # Minor and patch updates come in one PR per ecosystem; major updates come one per
  # dependency, so a single breaking update doesn't hold the rest back.
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the Go port) has no JavaScript API yet, which vue-tsc and
      # typescript-eslint are built on.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
