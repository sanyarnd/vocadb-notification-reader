[package]
name = "vocadb-notification-reader"
version = "0.2.0"
authors = ["Alexander Biryukov <sanya.rnd@gmail.com>"]
edition = "2024"
rust-version = "1.99"

[[bin]]
name = "vocadb-notification-reader"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"

tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
futures = "0.3.34"

axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
regex = "1.13.1"
strum = { version = "0.28.0", features = ["derive"] }

redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
getrandom = "0.4.3"
sha2 = "0.11.0"
hex = "0.4.3"
cookie = "0.18.2"
ipnet = "2.12.2"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
wiremock = "0.6.5"
