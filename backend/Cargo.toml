[package]
name = "vocadb-notification-reader"
version = "0.2.0"
authors = ["Alexander Biryukov <sanya.rnd@gmail.com>"]
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "vocadb-notification-reader"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1"
thiserror = "2"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
futures = "0.3"

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
strum = { version = "0.28", features = ["derive"] }

redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
cookie = "0.18"
ipnet = "2"
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
